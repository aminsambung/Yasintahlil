name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova Globally
      run: npm install -g cordova

    - name: Create Cordova Project & Setup Icon
      run: |
        # Ganti "Yasin & Tahlil" dengan nama aplikasi yang kamu mau
        cordova create myApp com.yasin.app "Yasin & Tahlil"
        cd myApp
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Tambahkan platform android
        cordova platform add android
        
        # --- TIMPA MANUAL SEMUA ICON ---
        TARGET_DIR="platforms/android/app/src/main/res"
        
        # Timpa semua file ic_launcher.png di folder mipmap
        find $TARGET_DIR -name "ic_launcher.png" -exec cp ../icon.png {} \;
        
        # Timpa juga file ic_launcher_round.png (untuk icon bulat)
        find $TARGET_DIR -name "ic_launcher_round.png" -exec cp ../icon.png {} \;
        
        # Timpa file ic_launcher_foreground.png (untuk Adaptive Icons di Android modern)
        find $TARGET_DIR -name "ic_launcher_foreground.png" -exec cp ../icon.png {} \;
        
        # --- INI DIA KUNCINYA: HAPUS FOLDER ADAPTIVE ICON ---
        rm -rf $TARGET_DIR/mipmap-anydpi-v26
        # ---------------------------------------------------

    - name: Build Release APK (Unsigned)
      run: |
        cd myApp
        cordova build android --release -- --packageType=apk

    # --- BAGIAN AUTO SIGN APK ---
    - name: Generate Keystore & Sign APK
      run: |
        cd myApp
        
        keytool -genkey -v -keystore my-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias yasin-key \
          -storepass yasin123 \
          -keypass yasin123 \
          -dname "CN=YasinApp, OU=Dev, O=Yasin, L=Jakarta, S=DKI, C=ID"
        
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        
        $BUILD_TOOLS/apksigner sign --ks my-release-key.jks \
          --ks-key-alias yasin-key \
          --ks-pass pass:yasin123 \
          --key-pass pass:yasin123 \
          --out app-release-signed.apk \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yasin-App-Release-Signed
        path: myApp/app-release-signed.apk
