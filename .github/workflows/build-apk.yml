name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova Globally
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create myApp com.yasin.app YasinApp
        cd myApp
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Tambahkan platform android
        cordova platform add android

    - name: Override App Icon Manually
      run: |
        cd myApp
        # Timpa semua file ic_launcher bawaan android dengan icon.png kita
        TARGET_DIR="platforms/android/app/src/main/res"
        
        cp ../icon.png $TARGET_DIR/mipmap-mdpi/ic_launcher.png
        cp ../icon.png $TARGET_DIR/mipmap-hdpi/ic_launcher.png
        cp ../icon.png $TARGET_DIR/mipmap-xhdpi/ic_launcher.png
        cp ../icon.png $TARGET_DIR/mipmap-xxhdpi/ic_launcher.png
        cp ../icon.png $TARGET_DIR/mipmap-xxxhdpi/ic_launcher.png
        
        cp ../icon.png $TARGET_DIR/mipmap-mdpi/ic_launcher_round.png
        cp ../icon.png $TARGET_DIR/mipmap-hdpi/ic_launcher_round.png
        cp ../icon.png $TARGET_DIR/mipmap-xhdpi/ic_launcher_round.png
        cp ../icon.png $TARGET_DIR/mipmap-xxhdpi/ic_launcher_round.png
        cp ../icon.png $TARGET_DIR/mipmap-xxxhdpi/ic_launcher_round.png

    - name: Build Debug APK
      run: |
        cd myApp
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yasin-App-Debug
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
