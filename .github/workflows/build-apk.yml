name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova & cordova-res Globally
      run: |
        npm install -g cordova
        npm install -g cordova-res

    - name: Create Cordova Project
      run: |
        # Ganti "Yasin & Tahlil" dengan nama aplikasi yang kamu mau
        cordova create myApp com.yasin.app "Yasin & Tahlil"
        cd myApp
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Tambahkan platform android
        cordova platform add android
        
        # Generate icon otomatis dari file icon.png di root repo
        # (Pastikan file icon.png minimal 1024x1024 px ada di root repository kamu)
        cordova-res android --skip-config --copy

    # --- BAGIAN BUILD RELEASE ---
    - name: Build Release APK
      run: |
        cd myApp
        # Perintah build versi release, output berupa APK (bukan AAB)
        cordova build android --release -- --packageType=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yasin-App-Release
        # Path diarahkan ke folder release
        path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
