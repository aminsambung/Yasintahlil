name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova Globally
      run: npm install -g cordova

    - name: Create Cordova Project, Setup Icon & Splash
      run: |
        # Ganti "Yasin & Tahlil" dengan nama aplikasi yang kamu mau
        cordova create myApp com.yasin.app "Yasin & Tahlil"
        cd myApp
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Tambahkan platform android
        cordova platform add android
        
        # --- SETUP VARIABEL ---
        RES_DIR="platforms/android/app/src/main/res"
        
        # --- TIMPA MANUAL ICON ---
        find $RES_DIR -name "ic_launcher.png" -exec cp ../icon.png {} \;
        find $RES_DIR -name "ic_launcher_round.png" -exec cp ../icon.png {} \;
        find $RES_DIR -name "ic_launcher_foreground.png" -exec cp ../icon.png {} \;
        
        rm -rf $RES_DIR/mipmap-anydpi-v26
        
        # --- TIMPA SPLASH SCREEN DI SEMUA FOLDER ---
        for DIR in $RES_DIR/drawable*; do
          if [ -d "$DIR" ]; then
            cp ../splash.png "$DIR/splash.png"
          fi
        done
        
        # --- EDIT FILE styles.xml UNTUK MENGHAPUS ROBOT ABU-ABU ---
        STYLES_XML="$RES_DIR/values/styles.xml"
        if [ -f "$STYLES_XML" ]; then
          # Hapus baris windowSplashScreenAnimatedIcon yang mengacu ke icon default
          sed -i '/windowSplashScreenAnimatedIcon/d' $STYLES_XML
          # Hapus juga windowSplashScreenBackground agar background polos
          sed -i '/windowSplashScreenBackground/d' $STYLES_XML
          echo "styles.xml berhasil diupdate."
        fi
        # ---------------------------------------------------------

    - name: Build Release APK (Unsigned)
      run: |
        cd myApp
        cordova build android --release -- --packageType=apk

    # --- BAGIAN AUTO SIGN APK ---
    - name: Generate Keystore & Sign APK
      run: |
        cd myApp
        
        keytool -genkey -v -keystore my-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias yasin-key \
          -storepass yasin123 \
          -keypass yasin123 \
          -dname "CN=YasinApp, OU=Dev, O=Yasin, L=Jakarta, S=DKI, C=ID"
        
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        
        $BUILD_TOOLS/apksigner sign --ks my-release-key.jks \
          --ks-key-alias yasin-key \
          --ks-pass pass:yasin123 \
          --key-pass pass:yasin123 \
          --out app-release-signed.apk \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yasin-App-Release-Signed
        path: myApp/app-release-signed.apk
