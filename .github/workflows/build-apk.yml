name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova & cordova-res Globally
      run: |
        npm install -g cordova
        npm install -g cordova-res

    - name: Create Cordova Project & Generate Icon
      run: |
        # Ganti "Yasin & Tahlil" dengan nama aplikasi yang kamu mau
        cordova create myApp com.yasin.app "Yasin & Tahlil"
        cd myApp
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Buat folder resources
        mkdir -p resources
        
        # Cari file .png apapun di root repo, lalu salin ke resources/icon.png
        ICON_FILE=$(find .. -maxdepth 1 -name "*.png" | head -n 1)
        if [ -z "$ICON_FILE" ]; then
          echo "ERROR: Tidak ada file .png ditemukan di root repo!"
          exit 1
        fi
        cp "$ICON_FILE" resources/icon.png
        echo "Menggunakan file icon: $ICON_FILE"
        
        # --- PERBAIKAN DI SINI ---
        # Buat file splash.png otomatis menggunakan ImageMagick (convert)
        # Kita buat gambar polos 2732x2732 px dengan warna background aplikasi (#fdfbf7)
        convert -size 2732x2732 xc:"#fdfbf7" resources/splash.png
        # -------------------------
        
        # Tambahkan platform android
        cordova platform add android
        
        # Generate icon DAN splash screen otomatis
        cordova-res android --skip-config --copy

    - name: Build Release APK (Unsigned)
      run: |
        cd myApp
        # Perintah build versi release, output berupa APK (bukan AAB)
        cordova build android --release -- --packageType=apk

    # --- BAGIAN AUTO SIGN APK ---
    - name: Generate Keystore & Sign APK
      run: |
        cd myApp
        
        # 1. Buat Keystore otomatis menggunakan keytool
        keytool -genkey -v -keystore my-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias yasin-key \
          -storepass yasin123 \
          -keypass yasin123 \
          -dname "CN=YasinApp, OU=Dev, O=Yasin, L=Jakarta, S=DKI, C=ID"
        
        # 2. Tanda tangani APK menggunakan apksigner
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        
        $BUILD_TOOLS/apksigner sign --ks my-release-key.jks \
          --ks-key-alias yasin-key \
          --ks-pass pass:yasin123 \
          --key-pass pass:yasin123 \
          --out app-release-signed.apk \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yasin-App-Release-Signed
        # Path diarahkan ke APK yang sudah ditandatangani
        path: myApp/app-release-signed.apk
